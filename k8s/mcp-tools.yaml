apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tools
  namespace: agentic
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-tools}
  template:
    metadata:
      labels: {app: mcp-tools}
    spec:
      containers:
        - name: mcp-tools
          image: agentic/mcp-tools:dev
          ports:
            - containerPort: 8000
          env:
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: OLLAMA_URL
              value: http://ollama:11434
            - name: EMBED_MODEL
              value: nomic-embed-text
            - name: COLLECTION  # must match the ingest job
              value: documents_nomic_v1
            - name: CORPUS_CONFIG  # what the library covers comes from [search] in corpus.toml
              value: /config/corpus.toml
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            tcpSocket: {port: 8000}
      volumes:
        - name: config
          configMap:
            name: corpus-config  # made from corpus.toml by `make config`
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-tools
  namespace: agentic
spec:
  selector: {app: mcp-tools}
  ports:
    - port: 8000
