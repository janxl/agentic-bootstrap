apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: agentic
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: agentic
spec:
  replicas: 1
  strategy:
    type: Recreate  # single RWO volume
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      labels: {app: ollama}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent  # :latest defaults to Always, which re-pulls 2.8 GB on every restart
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_KEEP_ALIVE  # keep model in RAM between requests
              value: "30m"
            - name: OLLAMA_NUM_PARALLEL  # one request at a time: less KV-cache memory
              value: "1"
            - name: OLLAMA_CONTEXT_LENGTH  # room for the system prompt, 6 tool schemas and a few searches
              value: "8192"
          resources:
            limits:
              memory: 6Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet: {path: /, port: 11434}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: agentic
spec:
  selector: {app: ollama}
  ports:
    - port: 11434
