apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: agentic
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: agentic/gateway:dev
          ports:
            - containerPort: 8000
          env:
            - name: ACCESS_LOG    # uvicorn "POST /chat 200 OK" lines: "true" / "false"
              value: "true"
            - name: AGENT_URL
              value: http://agent:8000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: agentic
spec:
  selector: {app: gateway}
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: agentic
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 80}
